 class="legend"><span><i style="background:#00a896"></i>Faturamento</span><span><i style="background:#0b2d5b"></i>Disponível após reserva</span></div></div><div class="panel"><div class="panel-head"><div><h3>Modelo de negócio</h3><p class="panel-desc">Foco comercial, proposta de valor e metas.</p></div></div><div class="stat-list"><div class="mini-tile"><small>Proposta de valor</small><b>PA médico digital 24h + especialidades agendadas</b></div><div class="mini-tile"><small>Canais prioritários</small><b>Revenda · Empresas · Pessoas físicas</b></div><div class="mini-tile"><small>Receita prevista no ciclo</small><b>${money(acc)}</b></div><div class="mini-tile"><small>Saldo disponível acumulado após reserva</small><b>${money(avail)}</b></div><div class="mini-tile"><small>Plano de execução</small><b>${task.done}/${task.total} ações concluídas · ${task.opened} riscos abertos</b></div></div></div></div><div class="grid g2" style="margin-top:16px"><div class="panel"><div class="panel-head"><h3>Participação comercial no faturamento de junho</h3><span class="pill">Ticket médio ${money(avgTicket(),2)}</span></div>${hbars(end.groups.map(g=>({label:g.name,value:g.revenue})))}</div><div class="panel"><div class="panel-head"><h3>Pilares estratégicos</h3></div><div class="roadmap"><div class="roadmap-row"><div class="roadmap-date">01 · Produto</div><div class="roadmap-body"><b>Assistência confiável</b><p>Prestação clínica terceirizada à Zelo Saúde; monitorar disponibilidade, triagem, suporte e experiência do beneficiário.</p></div></div><div class="roadmap-row"><div class="roadmap-date">02 · Receita</div><div class="roadmap-body"><b>Vendas recorrentes com quatro preços</b><p>Gestão de contratos empresariais, revendedores e assinaturas individuais com cobrança por vida ativa.</p></div></div><div class="roadmap-row"><div class="roadmap-date">03 · Execução</div><div class="roadmap-body"><b>Processo replicável</b><p>CRM, roteiros comerciais, faturamento, acompanhamento de metas semanais e aprovação das peças de marketing.</p></div></div><div class="roadmap-row"><div class="roadmap-date">04 · Caixa</div><div class="roadmap-body"><b>Reserva protegida de 10%</b><p>Reservar caixa separadamente; não tratar capital de giro como despesa contábil.</p></div></div></div></div></div>${Math.abs(shareTotal-100)>0.001?`<div class="alert error" style="margin-top:16px">O mix comercial soma ${pct(shareTotal)}. O painel normalizou proporcionalmente os quatro canais. Ajuste as participações para somarem 100% na aba Vendas e metas.</div>`:''}<div class="data-tip"><strong>Como usar:</strong> altere preços, percentuais, metas ou custos nas abas de edição. Todas as projeções são recalculadas imediatamente e cada alteração é registrada em <b>Auditoria e dados</b>. As informações são salvas no navegador, não em um servidor.</div>`}
function hbars(items){let max=Math.max(1,...items.map(v=>v.value));return `<div class="hbars">${items.map(v=>`<div class="hbar-item"><div class="hbar-title">${esc(v.label)}</div><div class="progress"><div style="width:${Math.max(0,v.value/max*100)}%"></div></div><div class="hbar-val">${money(v.value)}</div></div>`).join('')}</div>`}
function configInput(key,label,suffix='',help='',step='0.01'){return `<div class="field"><label for="p-${key}">${label}</label><input id="p-${key}" data-param="${key}" type="number" min="0" step="${step}" value="${state.params[key]}"><small>${suffix?`Unidade: ${suffix}. `:''}${help}</small></div>`}
function financialTable(rs){return `<div class="table-wrap"><table><thead><tr><th>Mês</th><th>Vidas</th><th>Receita</th><th>Tributos</th><th>Comissões</th><th>Zelo Saúde</th><th>Desp. oper. 10%</th><th>Fixos</th><th>Lucro oper.</th><th>Reserva 10%</th><th>Disponível</th></tr></thead><tbody>${rs.map(r=>`<tr><td><strong>${r.month}</strong></td><td>${fmt(r.lives)}</td><td>${money(r.revenue)}</td><td>${money(r.tax)}</td><td>${money(r.commission)}</td><td>${money(r.sp.cost)}</td><td>${money(r.opex)}</td><td>${money(r.basefixed)}</td><td class="${r.profit>=0?'good-txt':'bad-txt'}">${money(r.profit)}</td><td>${money(r.reserve)}</td><td class="${r.after>=0?'good-txt':'bad-txt'}">${money(r.after)}</td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL</td><td>—</td><td>${money(total(rs,'revenue'))}</td><td>${money(total(rs,'tax'))}</td><td>${money(total(rs,'commission'))}</td><td>${money(rs.reduce((s,r)=>s+r.sp.cost,0))}</td><td>${money(total(rs,'opex'))}</td><td>${money(total(rs,'basefixed'))}</td><td>${money(total(rs,'profit'))}</td><td>${money(total(rs,'reserve'))}</td><td>${money(total(rs,'after'))}</td></tr></tfoot></table></div>`}
function cashRows(rs){let p=state.params,setup=p.setupCost+p.setupExtra,bank=p.initialCash-setup,reserved=0,out=[];for(let r of rs){bank+=r.profit;reserved+=r.reserve;out.push({month:r.month,profit:r.profit,reserve:r.reserve,bank,reserved,free:bank-reserved})}return {rows:out,setup,initial:p.initialCash,startBank:p.initialCash-setup}}
function cashTable(rs){let cr=cashRows(rs);return `<div class="table-wrap"><table><thead><tr><th>Período</th><th>Movimento operacional</th><th>Reserva do mês</th><th>Caixa projetado*</th><th>Reserva acumulada</th><th>Saldo livre acumulado*</th></tr></thead><tbody><tr><td><strong>Pré-operação</strong></td><td>${money(-cr.setup)}</td><td>—</td><td class="${cr.startBank<0?'bad-txt':'good-txt'}">${money(cr.startBank)}</td><td>—</td><td class="${cr.startBank<0?'bad-txt':'good-txt'}">${money(cr.startBank)}</td></tr>${cr.rows.map(r=>`<tr><td><strong>${r.month}</strong></td><td>${money(r.profit)}</td><td>${money(r.reserve)}</td><td class="${r.bank<0?'bad-txt':'good-txt'}">${money(r.bank)}</td><td>${money(r.reserved)}</td><td class="${r.free<0?'bad-txt':'good-txt'}">${money(r.free)}</td></tr>`).join('')}</tbody></table></div>`}
function supplierTable(rs){return `<div class="table-wrap"><table><thead><tr><th>Mês</th><th>Vidas ativas</th><th>Vidas faturáveis</th><th>Base mínima aplicada</th><th>Tarifa/vida</th><th>Custo Zelo</th><th>Vencimento*</th><th>Regra</th></tr></thead><tbody>${rs.map(r=>`<tr><td><strong>${r.month}</strong></td><td>${fmt(r.lives)}</td><td>${fmt(r.sp.count)}</td><td>${fmt(r.sp.min)}</td><td>${money(r.sp.rate,2)}</td><td>${money(r.sp.cost)}</td><td>${r.sp.due||'—'}</td><td class="text-left subtle">${esc(r.sp.rule||'—')}</td></tr>`).join('')}</tbody></table></div><p class="footnote">* Datas expressas do cronograma contratual. Na minuta V2 o vencimento dia 08 foi uniformizado na regra de faturamento e no cronograma expresso.</p>`}
function renderFinancial(){let rs=rows(),last=rs.at(-1),p=state.params;return header('Motor financeiro · demonstrativo gerencial','Premissas, DRE e caixa','Parâmetros editáveis, regras de faturamento Zelo Saúde, resultado por competência e cenários de cumprimento da meta.')+scenarioToolbar()+`<div class="grid metrics">${metric('Receita de junho',money(last.revenue),'Bruto recorrente estimado','teal')}${metric('Lucro operacional de junho',money(last.profit),'Antes da reserva financeira','navy')}${metric('Reserva financeira de junho',money(last.reserve),'Retenção de caixa · não despesa','gold')}${metric('Saldo livre de junho',money(last.after),'Após a reserva de 10%','teal')}</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Parâmetros financeiros editáveis</h3><p class="panel-desc">Ao sair de cada campo, o cálculo é atualizado e a mudança fica registrada na auditoria.</p></div><span class="pill good">Cálculo automático</span></div><div class="group-heading">Tributos, comercial e operação</div><div class="form-grid">${configInput('tax','Impostos','% da receita','Provisão, validar com contador','0.1')}${configInput('commission','Comissões','% da receita','Inclui revendedores por conservadorismo','0.1')}${configInput('opex','Despesas operacionais','% da receita','Internet, combustível, viagens, marketing','0.1')}${configInput('reserve','Reserva de capital de giro','% da receita','Retenção de caixa, não despesa contábil','0.1')}${configInput('payroll','Funcionários','R$/mês','Sem encargos adicionais no modelo','1')}${configInput('accounting','Contabilidade','R$/mês','Agilize','1')}${configInput('virtualOffice','Escritório virtual','R$/mês','','1')}${configInput('churn','Churn mensal estimado','% das vidas','Afeta aquisição bruta necessária, não meta ativa','0.1')}</div><div class="group-heading">Contrato Zelo Saúde e investimento inicial</div><div class="form-grid">${configInput('supplierRegular','Zelo Saúde até 3 mil vidas','R$/vida','PA + especialidades','0.01')}${configInput('supplierVolume','Zelo Saúde acima de 3 mil','R$/vida','Faixa até 10 mil vidas','0.01')}${configInput('supplierThreshold','Limiar de tarifa volume','vidas','A nova faixa começa em 3.001','1')}${configInput('supplierMinFirst','Mínimo até março/2027','vidas','Promoção de 250 vidas somente com até 250 ativas; gatilho acima aplica 500 vidas','1')}${configInput('supplierMinLater','Mínimo a partir de abril','vidas','500 vidas na regra ordinária e sempre desde abril/2027','1')}${configInput('supplierFreeMonths','Meses de isenção (não confirmados)','meses','Base aprovada: zero. Só altere mediante aditivo assinado.','1')}${configInput('specialtyLimitPct','Limite de especialidades','% das vidas ativas','Limite base de 1%. Custos excedentes NÃO incluídos na DRE.','0.1')}${configInput('setupCost','Taxas da abertura','R$ único','DARE 454 + prefeitura 44 (estimados)','1')}${configInput('setupExtra','Setup Zelo e outras implantações','R$ único','Setup R$1.500 na minuta; vencimento 28/10/2026','1')}${configInput('initialCash','Caixa inicial disponível','R$','Para calcular necessidade de capital pré-op','1')}</div><p class="footnote">O desembolso inicial estimado de abertura e setup de ${money(p.setupCost+p.setupExtra)} é tratado separadamente do resultado operacional do ciclo de dezembro/2026 a junho/2027; não foi duplicado nas despesas mensais.</p></div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>DRE gerencial estimada · dezembro a junho</h3><p class="panel-desc">Provisões sobre receita bruta; reserva apresentada após o resultado operacional.</p></div><button class="button compact" data-download="finance">Exportar CSV</button></div>${financialTable(rs)}</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Posição de caixa projetada · modelo simplificado</h3><p class="panel-desc">Capital inicial menos abertura pré-operacional, acrescido de cada resultado operacional, com reserva acumulada destacada.</p></div><span class="pill">Pré-operação: ${money(p.setupCost+p.setupExtra)}</span></div>${cashTable(rs)}<p class="footnote">* Este quadro é uma simulação de caixa simplificada, assumindo recebimento integral das receitas e pagamento integral dos gastos na mesma competência, sem inadimplência, parcelamentos ou defasagens. O mês de pré-operação inclui ${money(p.setupCost+p.setupExtra)} em abertura e implantações. Não substitui conciliação bancária. Se o saldo estiver negativo, será necessário capital inicial ou postergação de saídas.</p></div><div class="grid g2"><div class="panel"><div class="panel-head"><h3>Fornecedor · memória de cálculo</h3></div>${supplierTable(rs)}</div><div class="panel"><div class="panel-head"><h3>Fórmulas e reconciliação</h3><span class="pill good">Auditáveis</span></div><div class="rule"><b>Faturamento mensal</b><p>Σ (vidas ativas por canal × preço do canal). As participações são normalizadas se não somarem 100%.</p></div><div class="rule" style="margin-top:8px"><b>Fornecedor Zelo Saúde</b><p>Dez/26–mar/27: até ${fmt(p.supplierMinFirst)} vidas ativas, fatura de ${money(p.supplierMinFirst*p.supplierRegular)}; acima disso, aplica-se imediatamente o mínimo ordinário de ${fmt(p.supplierMinLater)} vidas (${money(p.supplierMinLater*p.supplierRegular)}). Desde abril: mínimo de ${fmt(p.supplierMinLater)} vidas. Tarifa de escala conforme minuta V2 a partir da vida ${fmt(p.supplierThreshold+1)}.</p></div><div class="rule" style="margin-top:8px"><b>Resultado operacional</b><p>Receita – Zelo Saúde – ${pct(p.tax)} impostos – ${pct(p.commission)} comissões – ${pct(p.opex)} despesas operacionais – folha – contador – escritório.</p></div><div class="rule" style="margin-top:8px"><b>Disponível após retenção</b><p>Resultado operacional – ${pct(p.reserve)} da receita bruta destinada ao capital de giro. A reserva não altera o lucro operacional.</p></div><div class="alert" style="margin-top:13px">Minuta Zelo V2, 27/10/2026: setup R$1.500 (vencimento 28/10); quatro boletos promocionais de R$975 somente com até 250 vidas; acima disso mínimo de R$1.950. Correções confirmadas nas páginas 16–17: dia 08 de vencimento e tarifa R$3,60 desde 3.001 vidas. Mantém-se pendente a tabela de excedentes acima de 1% de especialidades, bem como a confirmação da assinatura e a revisão dos demais riscos contratuais.</div></div></div>`}
function renderSales(){let rs=rows(),last=rs.at(-1),sh=shares(),tot=state.channels.reduce((s,c)=>s+Number(c.share||0),0),actual=state.actuals.map((_,i)=>actualRow(i));return header('Crescimento · canais · funil comercial','Metas de aquisição e carteira','Edite mix de canais, preços e metas acumuladas. Informe vendas efetivas e faturamento registrado em cada mês para comparar planejado e realizado.')+scenarioToolbar()+`<div class="grid metrics">${metric('Vidas-meta · junho',fmt(last.lives),'Ativas e pagantes','teal')}${metric('Ticket médio ponderado',money(avgTicket(),2),'Com distribuição de canais atual','navy')}${metric('Novas vidas maio + junho',fmt(rs[5].newLives+rs[6].newLives),'Adesões brutas necessárias com churn','gold')}${metric('Canais de comercialização','4','Parcerias, empresas e pessoa física','navy')}</div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Precificação e participação por canal</h3><p class="panel-desc">Use valores de participação que somem 100%. Enquanto isso não ocorrer, os cálculos normalizam as proporções informadas.</p></div><span class="pill ${Math.abs(tot-100)<.001?'good':'warn'}">Participação declarada: ${pct(tot)}</span></div><div class="table-wrap"><table><thead><tr><th>Canal</th><th>Participação (%)</th><th>Preço / vida (R$)</th><th>Vidas em junho</th><th>Receita mensal</th><th>Contribuição / vida</th></tr></thead><tbody>${state.channels.map((c,i)=>{let g=last.groups[i],contri=c.price*(1-(state.params.tax+state.params.commission+state.params.opex)/100)-last.sp.rate;return `<tr><td><strong>${esc(c.name)}</strong><br><small class="subtle">${esc(c.description)}</small></td><td><input aria-label="Percentual ${esc(c.name)}" class="inline-input small" type="number" min="0" max="100" step="0.1" data-channel="${i}" data-field="share" value="${c.share}"></td><td><input aria-label="Preço ${esc(c.name)}" class="inline-input" type="number" min="0" step="0.01" data-channel="${i}" data-field="price" value="${c.price}"></td><td>${fmt(g.lives)}</td><td>${money(g.revenue)}</td><td class="${contri>=0?'good-txt':'bad-txt'}">${money(contri,2)}</td></tr>`}).join('')}</tbody><tfoot><tr><td>Total</td><td>${pct(tot)}</td><td>${money(avgTicket(),2)} médio</td><td>${fmt(last.lives)}</td><td>${money(last.revenue)}</td><td>Antes dos custos fixos</td></tr></tfoot></table></div>${Math.abs(tot-100)>.001?`<div class="alert error" style="margin-top:12px">Participações informadas somam ${pct(tot)}. A receita está calculada com proporções normalizadas. Corrija para exatamente 100% antes de aprovar a versão-base.</div>`:''}<div class="data-tip"><b>Política comercial:</b> o preço R$ 9,90 para revendedores foi tratado como preço de faturamento da VIDA. Os 10% de comissão são aplicados também nesse canal para prudência. Valide a política para impedir dupla remuneração sobre a revenda.</div></div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Metas mensais editáveis</h3><p class="panel-desc">Metas de vidas ativas e pagantes; novas vidas incluem reposição de churn estimado de ${pct(state.params.churn)} ao mês.</p></div></div><div class="table-wrap"><table><thead><tr><th>Competência</th><th>Meta de vidas</th><th>Novas vidas necessárias</th><th>Perdas por churn</th><th>Receita prevista</th><th>Saldo livre previsto</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td><strong>${r.month}</strong></td><td><input class="inline-input medium" type="number" min="0" max="100000" step="1" value="${state.targets[i]}" data-target="${i}" aria-label="Meta ${r.month}"></td><td>${fmt(r.newLives)}</td><td>${fmt(r.loss)}</td><td>${money(r.revenue)}</td><td class="${r.after>=0?'good-txt':'bad-txt'}">${money(r.after)}</td></tr>`).join('')}</tbody></table></div></div><div class="panel"><div class="panel-head"><div><h3>Acompanhamento real · entrada manual</h3><p class="panel-desc">Os campos vazios permanecem não informados. Custos não preenchidos são calculados por hipótese e identificados como estimativas, não como comprovantes contábeis.</p></div><span class="pill">Sem conexão com bancos / CRM</span></div><div class="table-wrap"><table><thead><tr><th>Mês</th><th>Vidas reais</th><th>Receita realizada (R$)</th><th>Recebido no caixa (R$)</th><th>Receita projetada</th><th>Desvio de receita</th><th>Saldo realizado*</th><th>Qualidade do dado</th></tr></thead><tbody>${rs.map((r,i)=>{let a=state.actuals[i],ar=actual[i];return `<tr><td><strong>${r.month}</strong></td><td><input class="inline-input small" type="number" min="0" step="1" placeholder="—" value="${a.lives??''}" data-actual="${i}" data-field="lives" aria-label="Vidas reais ${r.month}"></td><td><input class="inline-input medium" type="number" min="0" step="0.01" placeholder="—" value="${a.revenue??''}" data-actual="${i}" data-field="revenue" aria-label="Faturado ${r.month}"></td><td><input class="inline-input medium" type="number" min="0" step="0.01" placeholder="—" value="${a.received??''}" data-actual="${i}" data-field="received" aria-label="Recebido ${r.month}"></td><td>${money(r.revenue)}</td><td class="${ar?(ar.revenue-r.revenue>=0?'good-txt':'bad-txt'):'subtle'}">${ar?money(ar.revenue-r.revenue):'—'}</td><td class="${ar?(ar.after>=0?'good-txt':'bad-txt'):'subtle'}">${ar?money(ar.after):'—'}</td><td>${ar?`<span class="pill ${ar.estimatedCosts?'warn':'good'}">${ar.estimatedCosts} custos estimados</span>`:'<span class="pill">Não informado</span>'}</td></tr>`}).join('')}</tbody></table></div><p class="footnote">* Saldo realizado estimado = faturamento informado menos despesas informadas ou projetadas (se em branco), menos reserva. Para tornar o acompanhamento financeiro verificável, lance as despesas reais na aba Auditoria e dados &gt; Custos realizados. O campo «recebido» permite identificar diferenças de caixa, mas não é utilizado no regime de competência da DRE.</p></div>`}

function renderRisks(){return header('Gestão responsável · riscos e controles','Governança, validações e conformidade','Governança comercial e assistencial compatível com uma empresa que intermedeia acesso a atendimento médico remoto de um fornecedor parceiro.')+`<div class="grid g2" style="margin-bottom:16px"><div class="panel"><div class="panel-head"><h3>Fatos e premissas de origem</h3></div><div class="kv"><span>Fornecimento clínico</span><strong>Zelo Saúde (selecionada)</strong></div><div class="kv"><span>Fonte</span><strong>Minuta V2 de 27/10/2026, 18 páginas, Anexo I</strong></div><div class="kv"><span>Tarifas negociadas</span><strong>R$ 3,90 até 3.000 / R$ 3,60 a partir de 3.001 (minuta V2 corrigida)</strong></div><div class="kv"><span>Setup inicial</span><strong>R$ 1.500 na minuta; 28/10/2026</strong></div><div class="kv"><span>Dezembro/26 a março/27</span><strong>R$ 975 somente até 250 vidas; acima, mínimo R$ 1.950</strong></div><div class="kv"><span>Desde abril/27</span><strong>500 vidas mínimas faturáveis</strong></div><div class="kv"><span>Especialidades</span><strong>1% da base total de vidas ativas</strong></div><div class="kv"><span>Atendimento especializado</span><strong>Encaminhamento interno; excedentes sujeitos à tabela a confirmar</strong></div><div class="kv"><span>White label</span><strong>Ambiente personalizado; app não comprovado na minuta anterior</strong></div><div class="kv"><span>Mensalidades</span><strong>Dia 08 do mês seguinte, uniformizado na V2</strong></div><p class="footnote">Minuta V2 recebida em 27/10/2026; não há comprovação de assinatura. As divergências de faixas e vencimento foram resolvidas. Permanece ausente a tabela de excedentes e necessária revisão jurídica. Dados pessoais do contrato original não são exibidos no GitHub público.</p></div><div class="panel"><div class="panel-head"><h3>Diretrizes jurídicas e de comunicação</h3></div><div class="rule"><b>Telemedicina e publicidade médica</b><p>Validar responsáveis técnicos, prestação clínica efetiva e publicidade segundo normas do CFM; não anunciar consulta com especialista como imediata ou ilimitada.</p></div><div class="rule" style="margin-top:9px"><b>Distinção de plano de saúde</b><p>Usar «telemedicina e benefícios», evitando confusão com um plano de saúde regulamentado pela ANS.</p></div><div class="rule" style="margin-top:9px"><b>LGPD</b><p>Dados de saúde são sensíveis. Não registrar prontuários, diagnósticos ou CPF de beneficiários neste painel financeiro local. Aplicar mínimo necessário e perfis de acesso no ambiente operacional.</p></div><div class="rule" style="margin-top:9px"><b>Distribuição / revenda</b><p>Contratos claros de responsabilidade, preço, recolhimento tributário, autorização de marca, cancelamento e repasse de comissões.</p></div><div class="source-list" style="margin-top:12px"><a href="https://portal.cfm.org.br/buscar-normas-cfm-e-crm/" target="_blank" rel="noopener">CFM · busca de normas — Resolução 2.314/2022 ↗</a><a href="https://www.gov.br/ans/pt-br/centrais-de-conteudo/miniatura-cartilha-prepago-pdf" target="_blank" rel="noopener">ANS · cartões de desconto não são planos de saúde ↗</a><a href="https://www.gov.br/anpd/pt-br/acesso-a-informacao/perguntas-frequentes" target="_blank" rel="noopener">ANPD · dados pessoais sensíveis ↗</a></div></div></div><div class="panel"><div class="panel-head"><div><h3>Matriz de riscos e plano de tratamento</h3><p class="panel-desc">Edite o status e o responsável. A lista foi construída com base na operação e nas condições comerciais documentadas.</p></div></div><div class="table-wrap"><table><thead><tr><th>Risco / pendência</th><th>Impacto</th><th>Probabilidade</th><th>Responsável</th><th>Tratamento</th><th>Situação</th></tr></thead><tbody>${state.risks.map(r=>`<tr><td style="min-width:220px"><strong>${esc(r.title)}</strong></td><td><span class="pill ${riskLabel(r.impact)}">${esc(r.impact)}</span></td><td><span class="pill ${riskLabel(r.probability)}">${esc(r.probability)}</span></td><td><input class="inline-input medium" data-risk="${esc(r.id)}" data-field="owner" value="${esc(r.owner)}"></td><td class="text-left" style="min-width:280px">${esc(r.mitigation)}</td><td><select class="inline-select" data-risk="${esc(r.id)}" data-field="status">${['Aberto','Em tratamento','Mitigado','Aceito'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function renderAudit(){let act=state.actuals;let sums=state.channels.reduce((s,c)=>s+(Number(c.share)||0),0),p=state.params,rs=rows(),errs=[];if(Math.abs(sums-100)>.001)errs.push(`Participação dos canais = ${pct(sums)}; ajustar para 100%.`);if(state.targets.some((v,i)=>i>0&&v<state.targets[i-1]))errs.push('Meta acumulada está menor que a de mês anterior.');if(rs.some(r=>r.after<0))errs.push('Há mês com caixa disponível negativo após reserva.');if(state.targets.at(-1)>10000)errs.push('A meta ultrapassa o limite da faixa Zelo Saúde documentada (10 mil vidas); é necessária nova cotação.');if(p.supplierFreeMonths>7)errs.push('Meses gratuitos ultrapassam o horizonte do projeto.');if(p.specialtyLimitPct>100)errs.push('Limite de especialidades acima de 100% da base.');if(p.supplierFreeMonths>0)errs.push('Gratuidade configurada sem suporte na negociação Zelo; confirmar aditivo.');if(p.tax+p.commission+p.opex+p.reserve>100)errs.push('Percentuais de tributos, comissões, despesas e reserva totalizam mais de 100%.');if(!errs.length)errs.push('As principais consistências aritméticas do modelo passaram na verificação.');let complete=state.actuals.filter((a,i)=>actualRow(i)!==null).length;return header('Rastreabilidade · evidências · backup','Auditoria, realizado e controle dos dados','Histórico datado das alterações, fórmulas abertas, campos de despesas reais e exportação para análise independente.')+`<div class="grid metrics">${metric('Alterações registradas',fmt(state.history.length),'Trilha de edição no navegador','navy')}${metric('Meses com realizado',`${complete} / 7`,'Vidas e receita lançadas','teal')}${metric('Regras financeiras','4','Receita, Zelo Saúde, DRE e reserva','gold')}${metric('Alertas de consistência',fmt(errs.length===1&&errs[0].startsWith('As principais')?0:errs.length),'Validações automáticas','navy')}</div><div class="grid g2" style="margin-bottom:16px"><div class="panel"><div class="panel-head"><h3>Testes de consistência</h3><span class="pill ${errs.length===1&&errs[0].startsWith('As principais')?'good':'warn'}">${errs.length===1&&errs[0].startsWith('As principais')?'Aprovado':'Verificar'}</span></div>${errs.map(e=>`<div class="alert ${e.startsWith('As principais')?'info':''}" style="margin-bottom:8px">${esc(e)}</div>`).join('')}<div class="data-tip"><b>Controle de veracidade:</b> o painel demonstra a origem das premissas e como os números foram calculados. Uma alteração registrada não comprova que um dado foi validado documentalmente.</div></div><div class="panel"><div class="panel-head"><h3>Operação e transferência dos dados</h3></div><div class="field" style="max-width:310px"><label>Responsável pelas próximas alterações</label><input type="text" id="actor" maxlength="80" value="${esc(state.editedBy)}"><small>O autor é declarado manualmente; não há login nem assinatura digital.</small></div><div class="badge-gap" style="margin-top:13px"><button class="button primary" id="audit-export">↓ Exportar backup completo</button><button class="button" id="audit-import">↑ Importar backup JSON</button><button class="button" data-download="audit">↓ Histórico CSV</button><button class="button" data-download="actual">↓ Realizado CSV</button><button class="button danger" id="audit-reset">↺ Restaurar base original</button></div><p class="footnote">Backup inclui parâmetros, metas, dados reais, tarefas, riscos e histórico. O autosave usa localStorage neste navegador. Não há sincronização, autenticação, criptografia de auditoria ou trilha inviolável; para auditoria formal utilize controles externos, versionamento, documentos de suporte e backups regulares.</p></div></div><div class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Custos efetivos por competência</h3><p class="panel-desc">Campo em branco = fórmula estimada. Preencha conforme notas fiscais, faturas e extratos. Valores informados substituem a estimativa na comparação.</p></div></div><div class="table-wrap"><table><thead><tr><th>Mês</th><th>Zelo Saúde (R$)</th><th>Impostos (R$)</th><th>Comissões (R$)</th><th>Operacionais (R$)</th><th>Funcionários (R$)</th><th>Admin. (R$)</th><th>Extras (R$)</th><th>Saldo líquido após reserva*</th></tr></thead><tbody>${YEARS.map((m,i)=>{let a=act[i],r=actualRow(i);let cells=['supplier','taxes','commissions','operational','payroll','admin','extra'].map(k=>`<td><input class="inline-input medium" aria-label="${k} ${MONTHS[i]}" data-actual="${i}" data-field="${k}" type="number" step="0.01" min="0" placeholder="Auto" value="${a[k]??''}"></td>`).join('');return `<tr><td><strong>${MONTHS[i]}</strong></td>${cells}<td class="${r&&r.after>=0?'good-txt':r?'bad-txt':'subtle'}">${r?money(r.after):'—'}</td></tr>`}).join('')}</tbody></table></div><p class="footnote">* Resultado por competência; para apuração do caixa efetivo, acompanhe também o recebido informado na aba Vendas e metas e os pagamentos em seus extratos. O campo extras permite lançar custos não cobertos pelo orçamento operacional. Os dados financeiros deste painel são agregados e não incluem informações clínicas.</p></div><div class="panel" id="audit-editor"><div class="panel-head"><div><h3>Histórico de alterações</h3><p class="panel-desc">Alterações de campos, registros reais, tarefas e riscos, com data e responsável declarado.</p></div><button class="button compact" data-download="audit">↓ CSV da auditoria</button></div>${state.history.length?state.history.slice(0,130).map(h=>`<div class="audit-item"><span class="subtle">${new Date(h.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}<br>${esc(h.actor)}</span><strong>${esc(h.section)}<br><span class="subtle">${esc(h.field)}</span></strong><div><code>${esc(h.before)} → <b>${esc(h.after)}</b></code><br><small class="subtle">${esc(h.note)}</small></div></div>`).join(''):'<div class="empty">Sem edições.</div>'}<p class="footnote">${state.history.length>130?'Mostrando 130 eventos recentes. Exporte o CSV para obter o histórico completo.':'Fim do histórico.'}</p></div>`}
function render(){renderCount++;document.getElementById('page-overview').innerHTML=renderOverview();document.getElementById('page-financial').innerHTML=renderFinancial();document.getElementById('page-sales').innerHTML=renderSales();document.getElementById('page-operations').innerHTML=renderOperations();document.getElementById('page-brand').innerHTML=renderBrand();document.getElementById('page-contract').innerHTML=renderContract();document.getElementById('page-risks').innerHTML=renderRisks();document.getElementById('page-audit').innerHTML=renderAudit();for(let p of ['overview','financial','sales','operations','brand','contract','risks','audit'])document.getElementById('page-'+p).classList.toggle('active',p===activePage);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));document.getElementById('sidebarVersion').textContent=APP_VERSION;}
function changeField(el){if(!el)return;let b=el.dataset;let raw=el.value;const numeric=el.type==='number';const n=raw===''?null:Number(raw);if(numeric&&raw!==''&&(!Number.isFinite(n)||n<0)){toast('Use um valor numérico válido e não negativo.');render();return;}if(b.param){let k=b.param,old=state.params[k];if(n===null){render();return;}let val=['supplierMinFirst','supplierMinLater','supplierThreshold','supplierFreeMonths'].includes(k)?Math.round(n):n;if(old===val)return;state.params[k]=val;record('Financeiro',k,old,val);render();return;}if(b.channel){let i=Number(b.channel),k=b.field,old=state.channels[i][k];if(n===null){render();return;}let val=k==='share'?Math.min(100,n):n;if(old===val)return;state.channels[i][k]=val;record('Mix comercial',`${state.channels[i].name} / ${k}`,old,val);render();return;}if(b.target!==undefined){let i=Number(b.target),old=state.targets[i];if(n===null){render();return;}let val=Math.round(n);if(old===val)return;state.targets[i]=val;record('Meta de vidas',MONTHS[i],old,val);render();return;}if(b.actual!==undefined){let i=Number(b.actual),k=b.field,old=state.actuals[i][k],val=raw===''?null:numeric?n:raw;if(old===val)return;state.actuals[i][k]=val;record('Realizado',MONTHS[i]+' / '+k,old,val,'Lançamento manual; documentos comprobatórios devem ser mantidos externamente.');render();return;}if(b.task){let item=state.tasks.find(t=>t.id===b.task);if(!item)return;let old=item[b.field];if(old===raw)return;item[b.field]=raw;record('Execução',item.title+' / '+b.field,old,raw);render();return;}if(b.risk){let item=state.risks.find(r=>r.id===b.risk);if(!item)return;let old=item[b.field];if(old===raw)return;item[b.field]=raw;record('Risco',item.title+' / '+b.field,old,raw);render();return;}if(el.id==='actor'){let old=state.editedBy;if(old===raw)return;state.editedBy=raw||'Gestor VIDA';record('Gestão','Responsável declarado',old,state.editedBy);render()}}
function csvSafe(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s)&&!/^\-\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}function csvRow(x){return x.map(csvSafe).join(';')}
function downloadText(filename,text,type){let blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);toast('Arquivo gerado: '+filename)}
function exportJSON(){let s={app:'VIDA — Dashboard de Planejamento',version:APP_VERSION,exportedAt:new Date().toISOString(),data:state};downloadText('VIDA_backup_auditavel_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(s,null,2),'application/json;charset=utf-8')}
function downloadCSV(type){let result=[],name='';if(type==='finance'){name='VIDA_projecao_financeira.csv';result=[['Competência','Vidas','Novas necessárias','Receita','Impostos','Comissões','Fornecedor','Despesas operacionais','Funcionários + administrativas','Lucro operacional','Reserva caixa','Disponível após reserva','Tarifa Zelo Saúde','Vidas faturáveis','Cenário'],...rows().map(r=>[r.month,r.lives,r.newLives,r.revenue,r.tax,r.commission,r.sp.cost,r.opex,r.basefixed,r.profit,r.reserve,r.after,r.sp.rate,r.sp.count,scenLabel()])]}else if(type==='actual'){name='VIDA_realizado_vs_planejado.csv';result=[['Mês','Meta vidas','Vidas reais','Receita planejada','Receita real','Recebido','Zelo Saúde','Impostos','Comissões','Desp operacionais','Funcionários','Admin','Extras','Resultado operacional','Reserva','Disponível','Estimativas de custo restantes'],...YEARS.map((x,i)=>{let r=rows()[i],a=actualRow(i);return [x,r.lives,a?.lives??'',r.revenue,a?.revenue??'',state.actuals[i].received??'',a?.supplierCost??'',a?.tax??'',a?.commission??'',a?.opex??'',a?.payrollCost??'',a?.adminCost??'',a?.extraCost??'',a?.profit??'',a?.reserve??'',a?.after??'',a?.estimatedCosts??'']})]}else if(type==='audit'){name='VIDA_trilha_auditoria.csv';result=[['Data/hora ISO','Autor declarado','Área','Campo','Antes','Depois','Observação'],...state.history.map(h=>[h.at,h.actor,h.section,h.field,h.before,h.after,h.note])]}if(result.length)downloadText(name,'\ufeff'+result.map(csvRow).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(file){if(!file)return;try{const t=await file.text();if(t.length>3_000_000)throw Error('O arquivo supera 3 MB.');let obj=JSON.parse(t),s=obj.data||obj;if(!s||s.schemaVersion!==1||!Array.isArray(s.channels)||s.channels.length!==4||!Array.isArray(s.targets)||s.targets.length!==7||!s.params||!Array.isArray(s.actuals)||s.actuals.length!==7||!Array.isArray(s.tasks)||!Array.isArray(s.risks)||!Array.isArray(s.history))throw Error('Formato ou versão de backup não reconhecidos.');if(!confirm('Substituir TODOS os dados locais pelos dados deste backup? Faça um backup antes de continuar.'))return;state=(s.supplier&&s.supplier.name==='Zelo Saúde'&&s.params.specialtyLimitPct!==undefined)?s:applyZelo(s);record('Importação','Arquivo JSON','Base atual',file.name,'Substituição completa por backup importado');render();toast('Backup importado e recalculado.')}catch(e){toast('Não foi possível importar: '+e.message)}finally{document.getElementById('input-file').value=''}}
// Delegação de eventos. Atualiza os valores no blur/change, nunca apenas em memória visual.
document.addEventListener('change',e=>{if(e.target.matches('[data-param],[data-channel],[data-target],[data-actual],[data-task],[data-risk],#actor'))changeField(e.target)});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){activePage=b.dataset.page;document.getElementById('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'instant'});return;}if(b.dataset.scenario){scenario=Number(b.dataset.scenario);render();return;}if(b.dataset.download){downloadCSV(b.dataset.download);return;}if(b.id==='btn-export-json'||b.id==='audit-export'){exportJSON();return;}if(b.id==='btn-export-csv'){downloadCSV('finance');return;}if(b.id==='audit-import'){document.getElementById('input-file').click();return;}if(b.id==='audit-reset'){if(!confirm('RESTAURAR A BASE INICIAL? Todas as alterações locais e o histórico atual serão perdidos. Exporte um backup antes.'))return;let old=state.history.length;state=deep(DEFAULT);record('Administração','Restauração',old+' eventos','Base inicial','Reinicialização solicitada pelo usuário; histórico anterior substituído.');scenario=100;render();toast('Base inicial restaurada.');return;}if(b.id==='menu-toggle'){document.getElementById('sidebar').classList.toggle('open');return;}if(b.id==='add-task'){let title=prompt('Nome da nova tarefa:');if(!title||!title.trim())return;let ph=prompt('Fase: Pré-operação, Lançamento, Crescimento ou Escala:','Crescimento')||'Crescimento';if(!['Pré-operação','Lançamento','Crescimento','Escala'].includes(ph))ph='Crescimento';let id='t'+Date.now();let task={id,phase:ph,title:title.trim().slice(0,180),owner:'A definir',date:'2027-06-30',status:'Pendente',detail:'Tarefa adicionada no painel.'};state.tasks.push(task);record('Execução',task.title,'—','Tarefa criada');render();return;}if(b.dataset.removeTask){let task=state.tasks.find(t=>t.id===b.dataset.removeTask);if(!task||!confirm('Excluir tarefa: '+task.title+'?'))return;state.tasks=state.tasks.filter(t=>t.id!==task.id);record('Execução',task.title,'Existente','Excluída');render();return;}});
document.getElementById('input-file').addEventListener('change',e=>importJSON(e.target.files?.[0]));
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue){toast('Dados alterados em outra aba. Recarregue para sincronizar.')}});
save();render();
</script></body></html>
